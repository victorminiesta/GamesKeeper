<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.ico">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- REGISTRO -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-center mb-3">Crear cuenta</h5>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="usernameRegister" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="usernameRegister" name="username" autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="emailRegister" class="form-label">Email</label>
                                <input type="email" class="form-control" id="emailRegister" name="email" autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordRegister" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passwordRegister" name="password" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrarse</button>
                        </form>
                    </div>
                </div>
                <div id="messageBox">

                </div>
                <div class ="text-center">
                    <p>Iniciar Sesión: <a href="/Bienvenida" class="link-hover">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
