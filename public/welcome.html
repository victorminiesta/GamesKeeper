<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - GamesKeeper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.ico">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="text-center mb-4">
                <h1>Bienvenido a GamesKeeper</h1>
                <p class="text-muted">Inicia sesión para ver tus juegos favoritos.</p>
            </div>

            <div id="messageBox"></div>

            <!-- LOGIN -->
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-center mb-3">Iniciar Sesión</h5>
                    <form id="loginForm" >
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de usuario</label>
                            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                    </form>
                </div>
            </div>
            <div class ="text-center">
                <p>¿No tienes una cuenta? <a href="/register" class="link-hover">Regístrate</a></p>
            </div>    
        </div>
    </div>
</div>

<script src="/js/welcome.js"></script>
</body>
</html>
