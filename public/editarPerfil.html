<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.ico">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Editar perfil</h5>
                    </div>
                    <div class="card-body">
                        <form id="updateForm">
                            <div class="mb-3">
                                <label for="usernameInput" class="form-label">Nombre de usuario</label>
                                <input type="text" class="form-control" id="usernameInput" name="usernameInput" autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email</label>
                                <input type="email" class="form-control" id="emailInput" name="emailInput" autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordInput" class="form-label">Nueva contraseña</label>
                                <input type="password" class="form-control" id="passwordInput" name="passwordInput" autocomplete="new-password">
                                <div class="form-text">Déjalo en blanco si no quieres cambiarla.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Actualizar</button>
                        </form>
                        <a href="/" class="btn btn-secondary w-100 mt-3">⬅ Volver</a>
                        <div id="msgDiv" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/editarPerfil.js"></script>
</body>
</html>
